name: Service Healthcheck

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH tunnel to active host
        env:
          SSH_KEY: ${{ secrets[vars.ACTIVE_TARGET_KEY_SECRET] }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TUNNEL_HOSTNAME: ${{ vars.SSH_TUNNEL_HOSTNAME }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cloudflared access tcp --hostname ${TUNNEL_HOSTNAME} --url localhost:2222 &
          echo $! > /tmp/peg-cloudflared.pid
          sleep 3
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName localhost
            Port 2222
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Run service health audit
        run: bash scripts/private-host-audit.sh health

      - name: Stop cloudflared
        if: always()
        run: kill "$(cat /tmp/peg-cloudflared.pid)" 2>/dev/null || true
