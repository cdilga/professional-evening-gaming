name: Deploy PEG Session Hub

on:
  push:
    branches: [main]
    paths:
      - "projects/peg-session-hub/**"
      - ".github/workflows/deploy-peg-session-hub.yml"
      - ".github/workflows/deploy-private-service.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-private-service.yml
    with:
      image_name: cdilga/professional-evening-gaming-session-hub
      docker_context: ./projects/peg-session-hub/api
      deploy_dir: ~/professional-evening-gaming/peg-session-hub
      compose_path: projects/peg-session-hub/infra/docker-compose.yml
      extra_compose_path: projects/peg-session-hub/infra/docker-compose.shared-db.yml
      env_example_path: projects/peg-session-hub/infra/.env.example
      deploy_script_path: projects/peg-session-hub/infra/scripts/deploy.sh
      setup_target_path: projects/peg-session-hub/infra/scripts/setup-target.sh
      validate_command: python3 -m compileall projects/peg-session-hub/api/app
    secrets:
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      TRUENAS_SSH_KEY: ${{ secrets.TRUENAS_SSH_KEY }}
