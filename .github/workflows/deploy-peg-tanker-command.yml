name: Deploy PEG Tanker Command

on:
  push:
    branches: [main]
    paths:
      - "projects/peg-tanker-command/**"
      - ".github/workflows/deploy-peg-tanker-command.yml"
      - ".github/workflows/deploy-private-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-private-service.yml
    with:
      image_name: cdilga/professional-evening-gaming-tanker-command
      docker_context: ./projects/peg-tanker-command/app
      deploy_dir: ~/professional-evening-gaming/peg-tanker-command
      compose_path: projects/peg-tanker-command/infra/docker-compose.yml
      env_example_path: projects/peg-tanker-command/infra/.env.example
      deploy_script_path: projects/peg-tanker-command/infra/scripts/deploy.sh
      setup_target_path: projects/peg-tanker-command/infra/scripts/setup-target.sh
    secrets:
      runtime_env: ${{ secrets.PEG_TANKER_COMMAND_RUNTIME_ENV }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      TRUENAS_SSH_KEY: ${{ secrets.TRUENAS_SSH_KEY }}
      TRITON_SSH_KEY: ${{ secrets.TRITON_SSH_KEY }}
